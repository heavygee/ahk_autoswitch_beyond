name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (for manual dispatch), e.g. v2.1.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push tag (manual runs)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "Tag input is required."
          }
          git tag $tag
          git push origin $tag

      - name: Install AutoHotkey
        shell: pwsh
        run: choco install autohotkey --yes

      - name: Compile EXE
        shell: pwsh
        run: |
          $inFile = "autoswitch mic for VR.ahk"
          $outFile = "autoswitch mic for VR.exe"
          $icon = Get-ChildItem -Path . -Filter *.ico -File | Select-Object -First 1
          $compilerCandidates = @(
            "C:\Program Files\AutoHotkey\Compiler\Ahk2Exe.exe",
            "C:\ProgramData\chocolatey\lib\autohotkey\tools\Compiler\Ahk2Exe.exe",
            "C:\ProgramData\chocolatey\bin\Ahk2Exe.exe"
          )
          $compiler = $compilerCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) {
            $cmd = Get-Command Ahk2Exe.exe -ErrorAction SilentlyContinue
            if ($cmd) {
              $compiler = $cmd.Source
            }
          }

          if (-not $compiler) { throw "Ahk2Exe not found in expected locations." }
          if (-not (Test-Path $inFile)) { throw "Input script not found: $inFile" }

          if ($null -ne $icon) {
            Write-Host "Using icon: $($icon.Name)"
            & $compiler /in $inFile /out $outFile /icon $icon.FullName
          } else {
            Write-Host "No .ico file found in repo root - compiling with default icon."
            & $compiler /in $inFile /out $outFile
          }

          if (-not (Test-Path $outFile)) { throw "Compilation failed: output EXE missing." }

      - name: Resolve release tag
        id: tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "value=${{ github.event.inputs.tag }}" >> $env:GITHUB_OUTPUT
          } else {
            "value=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          files: |
            autoswitch mic for VR.exe
            autoswitch mic for VR.ahk
            README.md
