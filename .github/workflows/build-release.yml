name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (for manual dispatch), e.g. v2.1.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push tag (manual runs)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "Tag input is required."
          }
          git tag $tag
          git push origin $tag

      - name: Detect ICO file
        id: icon
        shell: pwsh
        run: |
          $icon = $null
          if (Test-Path ".\images") {
            $icon = Get-ChildItem -Path ".\images" -Filter *.ico -File | Sort-Object Name | Select-Object -First 1
          }
          if ($null -eq $icon) {
            $icon = Get-ChildItem -Path . -Filter *.ico -File | Sort-Object Name | Select-Object -First 1
          }
          if ($null -ne $icon) {
            "has=true" >> $env:GITHUB_OUTPUT
            "path=$($icon.FullName)" >> $env:GITHUB_OUTPUT
            Write-Host "Detected icon: $($icon.FullName)"
          } else {
            "has=false" >> $env:GITHUB_OUTPUT
            Write-Host "No .ico found in ./images or repo root."
          }

      - name: Compile EXE (default icon)
        if: steps.icon.outputs.has != 'true'
        uses: benmusson/ahk2exe-action@v1
        with:
          in: .\autoswitch mic for VR.ahk
          out: .\autoswitch mic for VR.exe
          target: x64
          ahk-tag: v2.0.18
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile EXE (custom icon)
        if: steps.icon.outputs.has == 'true'
        uses: benmusson/ahk2exe-action@v1
        with:
          in: .\autoswitch mic for VR.ahk
          out: .\autoswitch mic for VR.exe
          icon: ${{ steps.icon.outputs.path }}
          target: x64
          ahk-tag: v2.0.18
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release tag
        id: tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "value=${{ github.event.inputs.tag }}" >> $env:GITHUB_OUTPUT
          } else {
            "value=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          files: |
            autoswitch mic for VR.exe
            autoswitch mic for VR.ahk
            README.md
